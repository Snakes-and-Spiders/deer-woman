const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rand(a,b+1)),pick=a=>a[Math.floor(Math.random()*a.length)];
const D=(ax,ay,bx,by)=>Math.hypot(bx-ax,by-ay);
function angDiff(a,b){let d=b-a;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return d;}
function turn(a,b,m){return a+clamp(angDiff(a,b),-m,m);}
function mulberry(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash(x,y){let h=(x*374761393+y*668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function el(c,x,y,rx,ry,col,rot){c.fillStyle=col;c.beginPath();c.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot||0,0,6.2832);c.fill();}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();}
function line(c,x0,y0,x1,y1){c.beginPath();c.moveTo(x0,y0);c.lineTo(x1,y1);c.stroke();}
function txt(s,x,y,size,col,align,font){const serif=!!font&&font.includes('serif');const pre=(font||'').replace('serif','').trim();cx.font=(pre?pre+' ':'')+size+'px '+(serif?'Georgia,serif':'"Trebuchet MS",Verdana,sans-serif');cx.fillStyle=col||'#eee';cx.textAlign=align||'left';cx.textBaseline='middle';cx.fillText(s,x,y);}
function wrap(c,s,maxW){const words=s.split(' '),out=[];let cur='';for(const w of words){const t=cur?cur+' '+w:w;if(c.measureText(t).width>maxW&&cur){out.push(cur);cur=w;}else cur=t;}if(cur)out.push(cur);return out;}

/* ---------------- audio ---------------- */
let AC=null,MG=null,NB=null;
function initAudio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=.5;MG.connect(AC.destination);const len=AC.sampleRate;NB=AC.createBuffer(1,len,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;ambStart();}catch(e){AC=null;}}
function nz(dur,vol,freq,type,q,t0){if(!AC)return;const t=AC.currentTime+(t0||0);const s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type=type||'lowpass';f.frequency.value=freq;f.Q.value=q||1;const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(g);g.connect(MG);s.start(t);s.stop(t+dur+.05);}
function tn(f0,f1,dur,vol,type,t0){if(!AC)return;const t=AC.currentTime+(t0||0);const o=AC.createOscillator();o.type=type||'sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(MG);o.start(t);o.stop(t+dur+.05);}
function sfx(k,v){if(!AC)return;v=v===undefined?1:v;switch(k){
case'shot':nz(.25,.7*v,2200);tn(140,40,.18,.6*v,'triangle');break;
case'rifle':nz(.5,.9*v,1600);tn(110,30,.35,.8*v,'triangle');nz(.9,.15*v,500,'lowpass',1,.1);break;
case'shotgun':nz(.45,1*v,1200);tn(90,30,.3,.8*v,'triangle');break;
case'tommy':nz(.1,.45*v,2600);tn(160,60,.07,.35*v,'triangle');break;
case'eshot':nz(.2,.3*v,1800);tn(120,40,.12,.22*v,'triangle');break;
case'bow':nz(.12,.2*v,1500,'bandpass',3);tn(300,120,.1,.12*v,'triangle');break;
case'knife':nz(.12,.35*v,3000,'highpass');break;
case'stab':nz(.15,.5*v,600);tn(200,80,.12,.3*v,'sawtooth');break;
case'hit':tn(180,60,.15,.5*v,'square');nz(.1,.3*v,800);break;
case'pick':tn(600,1200,.1,.22*v,'square');break;
case'cash':tn(1200,1200,.06,.18*v,'square');tn(1600,1600,.1,.18*v,'square',.07);break;
case'click':tn(900,700,.04,.15*v,'square');break;
case'empty':tn(300,250,.05,.3*v,'square');break;
case'reload':nz(.06,.3*v,2500,'bandpass',4);nz(.06,.3*v,1800,'bandpass',4,.25);break;
case'deer':tn(1400,800,.5,.16*v,'sine');tn(1200,700,.6,.1*v,'triangle',.05);break;
case'heart':tn(60,40,.15,.6*v,'sine');tn(60,40,.15,.45*v,'sine',.22);break;
case'card':nz(.07,.25*v,4000,'highpass');break;
case'alert':tn(500,900,.15,.22*v,'sawtooth');break;
case'death':tn(220,40,1.2,.35*v,'sawtooth');nz(1,.2*v,300);break;
case'revive':tn(300,900,1.5,.2*v,'sine');tn(450,1350,1.5,.12*v,'sine',.2);break;
case'siren':for(let i=0;i<4;i++){tn(700,1000,.35,.1*v,'sawtooth',i*.7);tn(1000,700,.35,.1*v,'sawtooth',i*.7+.35);}break;
}}
function ambStart(){const o1=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();o1.frequency.value=55;o2.frequency.value=55.8;o1.type=o2.type='sawtooth';f.type='lowpass';f.frequency.value=170;g.gain.value=.045;o1.connect(f);o2.connect(f);f.connect(g);g.connect(MG);o1.start();o2.start();const s=AC.createBufferSource();s.buffer=NB;s.loop=true;const f2=AC.createBiquadFilter();f2.type='bandpass';f2.frequency.value=380;f2.Q.value=.6;const g2=AC.createGain();g2.gain.value=.03;s.connect(f2);f2.connect(g2);g2.connect(MG);s.start();}

const OPQ=new Uint8Array(32);[1,3,7,9,10].forEach(v=>OPQ[v]=1);
function mkMap(name,w,h,fill){return{name,w,h,t:new Uint8Array(w*h).fill(fill),objs:[],lights:[],decor:[],reach:[],dark:.75,kind:name};}
function tget(m,x,y){if(x<0||y<0||x>=m.w||y>=m.h)return 9;return m.t[y*m.w+x];}
function tset(m,x,y,v){if(x>=0&&y>=0&&x<m.w&&y<m.h)m.t[y*m.w+x]=v;}
function rect(m,x0,y0,x1,y1,v){for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)tset(m,x,y,v);}
function circSet(m,cx0,cy0,r,v){for(let y=cy0-r;y<=cy0+r;y++)for(let x=cx0-r;x<=cx0+r;x++)if((x-cx0)**2+(y-cy0)**2<=r*r&&x>1&&y>1&&x<m.w-2&&y<m.h-2)tset(m,x,y,v);}
function walkT(v,isP){if(v===10)return!!isP;return!SOLID[v];}
function canAt(m,x,y,r,isP){return walkT(tget(m,Math.floor((x-r)/TS),Math.floor((y-r)/TS)),isP)&&walkT(tget(m,Math.floor((x+r)/TS),Math.floor((y-r)/TS)),isP)&&walkT(tget(m,Math.floor((x-r)/TS),Math.floor((y+r)/TS)),isP)&&walkT(tget(m,Math.floor((x+r)/TS),Math.floor((y+r)/TS)),isP);}
function computeReach(m,sx,sy){const seen=new Uint8Array(m.w*m.h),q=[sy*m.w+sx];seen[q[0]]=1;m.reach=[];while(q.length){const i=q.pop(),x=i%m.w,y=(i/m.w)|0;m.reach.push(i);for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=m.w||ny>=m.h)continue;const j=ny*m.w+nx;if(seen[j])continue;const v=m.t[j];if(SOLID[v]||v===10)continue;seen[j]=1;q.push(j);}}m.reachSet=seen;}

 for(let x=22;x<80;x++)for(let y=28;y<=33;y++){const v=tget(m,x,y);if(y===30||y===31)tset(m,x,y,v===2?14:4);else if(v===1||v===12)tset(m,x,y,0);}
 for(let y=16;y<=30;y++)for(let x=59;x<=63;x++){if(x===60||x===61)tset(m,x,y,4);else if(tget(m,x,y)===1)tset(m,x,y,0);}
 for(let y=31;y<=46;y++)for(let x=58;x<=62;x++){if(x===59||x===60)tset(m,x,y,4);else if(tget(m,x,y)===1)tset(m,x,y,0);}

 for(const[hx,hy]of[[13,22],[25,22],[10,32],[27,33],[16,37],[23,37]])rect(m,hx,hy,hx+2,hy+2,3);
 tset(m,19,30,15);

 computeReach(m,21,32);return m;

 while(qh<qt){const i=q[qh++],x=i%w,y=(i/w)|0,d=FF[i];if(d>60)continue;
  if(x>0){const j=i-1;if(FF[j]<0&&!SOLID[M.t[j]]&&M.t[j]!==10){FF[j]=d+1;q[qt++]=j;}}
  if(x<w-1){const j=i+1;if(FF[j]<0&&!SOLID[M.t[j]]&&M.t[j]!==10){FF[j]=d+1;q[qt++]=j;}}
  if(y>0){const j=i-w;if(FF[j]<0&&!SOLID[M.t[j]]&&M.t[j]!==10){FF[j]=d+1;q[qt++]=j;}}
  if(y<h-1){const j=i+w;if(FF[j]<0&&!SOLID[M.t[j]]&&M.t[j]!==10){FF[j]=d+1;q[qt++]=j;}}}}

function followFlow(n,spd,dt){if(!FF){wander(n,dt,spd*.5);return false;}const tx=Math.floor(n.x/TS),ty=Math.floor(n.y/TS);const here=ffAt(tx,ty);if(here<0){wander(n,dt,spd*.5);return false;}
 let best=here,bx=tx,by=ty;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const v=ffAt(tx+dx,ty+dy);if(v<0||v>=best)continue;if(dx&&dy&&(ffAt(tx+dx,ty)<0||ffAt(tx,ty+dy)<0))continue;best=v;bx=tx+dx;by=ty+dy;}

function evalHand(h){const rs=h.map(c=>c.r).sort((a,b)=>b-a);const fl=h.every(c=>c.s===h[0].s);const uq=[...new Set(rs)];let st=false,top=rs[0];if(uq.length===5){if(rs[0]-rs[4]===4)st=true;else if(rs.join()==='14,5,4,3,2'){st=true;top=5;}}
 const cnt={};rs.forEach(r=>cnt[r]=(cnt[r]||0)+1);const gr=Object.entries(cnt).map(([r,c])=>[c,+r]).sort((a,b)=>b[0]-a[0]||b[1]-a[1]);const k=gr.map(g=>g[1]);
 if(st&&fl)return[8,top];if(gr[0][0]===4)return[7,...k];if(gr[0][0]===3&&gr[1][0]===2)return[6,...k];if(fl)return[5,...rs];if(st)return[4,top];if(gr[0][0]===3)return[3,...k];if(gr[0][0]===2&&gr[1][0]===2)return[2,...k];if(gr[0][0]===2)return[1,...k];return[0,...rs];}
function cmpH(a,b){for(let i=0;i<Math.max(a.length,b.length);i++){const d=(a[i]||0)-(b[i]||0);if(d)return d;}return 0;}
function oppKeep(h){const e=evalHand(h);if(e[0]>=4)return[0,1,2,3,4];const sc=[0,0,0,0];h.forEach(c=>sc[c.s]++);const fs=sc.findIndex(v=>v===4);if(fs>=0&&e[0]<2)return h.map((c,i)=>c.s===fs?i:-1).filter(i=>i>=0);
 const cnt={};h.forEach(c=>cnt[c.r]=(cnt[c.r]||0)+1);const keep=h.map((c,i)=>cnt[c.r]>=2?i:-1).filter(i=>i>=0);if(keep.length)return keep;
 return h.map((c,i)=>[c.r,i]).sort((a,b)=>b[0]-a[0]).slice(0,2).map(x=>x[1]);}
function pkDraw(){let n=0;for(let i=0;i<5;i++)if(PK.sel[i]){PK.ph[i]=PK.deck.pop();n++;}const keep=oppKeep(PK.oh);let on=0;for(let i=0;i<5;i++)if(!keep.includes(i)){PK.oh[i]=PK.deck.pop();on++;}PK.sel=[0,0,0,0,0];PK.oppDrew=on;sfx('card');

let SCN=null;
function playScene(beats,onDone){G.mode='scene';SCN={beats,i:0,t:0,onDone,sfxd:false};}
function updScene(dt){const b=SCN.beats[SCN.i];SCN.t+=dt;if(b.sfx&&!SCN.sfxd){SCN.sfxd=true;sfx(b.sfx);}
 const full=(b.text||'').length,tt=full/48,done=SCN.t>=tt;
 if(kp.Escape){finishScene();return;}
 if(mouse.click||kp.Space||kp.Enter||kp.KeyE){if(!done)SCN.t=tt+.01;else nextBeat();}
 else if(done&&SCN.t>tt+(b.hold||3.4))nextBeat();}
function nextBeat(){SCN.i++;SCN.t=0;SCN.sfxd=false;if(SCN.i>=SCN.beats.length)finishScene();}
function finishScene(){const f=SCN.onDone;SCN=null;G.mode='play';if(f)f();}
function renderScene(){const b=SCN.beats[SCN.i];cx.save();b.d(cx,SCN.t);cx.restore();

 txt('Knife: '+(P.knife?KNIVES[P.knife].name+' [Q]':'none'),W-250,H-22,12,'#bbc');
 if(P.order.length>1){P.order.forEach((g,i)=>{txt((i+1)+'',W-262+i*22,H-90,12,i===P.cur?'#fc6':'#776','left','bold');});}
 // minimap
 const sc=Math.min(2,170/MM.width),mw=MM.width*sc,mh=MM.height*sc,mx=W-mw-12,my=12;cx.globalAlpha=.85;cx.fillStyle='#000';cx.fillRect(mx-2,my-2,mw+4,mh+4);cx.drawImage(MM,mx,my,mw,mh);cx.globalAlpha=1;const k=2*sc/TS;
 for(const n of npcs){let col=null;if(n.type==='gangster'&&n.hostile)col='#f92';else if(n.type==='gangster')col='#a86';else if(n.type==='hunter'||n.type==='cheater'||n.type==='mark')col='#f33';else if(n.type==='ally')col='#6cf';else if(n.type==='cop')col='#46f';if(col){cx.fillStyle=col;cx.fillRect(mx+n.x*k-1,my+n.y*k-1,3,3);}}
 for(const o of M.objs){cx.fillStyle='#fd6';cx.fillRect(mx+o.x*k-1.5,my+o.y*k-1.5,3,3);}
 cx.fillStyle='#fff';cx.fillRect(mx+P.x*k-2,my+P.y*k-2,4,4);cx.strokeStyle='rgba(255,255,255,.3)';cx.strokeRect(mx+cam.x*k,my+cam.y*k,W*k,H*k);
 // heat
 if(G.heat>0){const a=Math.sin(G.time*8)>0;txt('POLICE '+'★'.repeat(G.heat),W-mw/2-12,my+mh+16,14,a?'#f44':'#48f','center','bold');}
 // toasts
 G.toasts.forEach((t,i)=>{cx.globalAlpha=clamp(t.t,0,1);cx.font='14px "Trebuchet MS"';const w=Math.min(700,cx.measureText(t.s).width+24);cx.fillStyle='rgba(20,8,8,.85)';rr(cx,W/2-w/2,82+i*30,w,24,6);cx.fill();txt(t.s,W/2,94+i*30,14,'#f3e0c8','center');});cx.globalAlpha=1;
 if(G.prompt){cx.font='bold 15px "Trebuchet MS"';const w=cx.measureText(G.prompt).width+26;cx.fillStyle='rgba(0,0,0,.7)';rr(cx,W/2-w/2,H-128,w,30,8);cx.fill();txt(G.prompt,W/2,H-113,15,'#fd8','center','bold');}
 // crosshair
 if(G.mode==='play'){cx.strokeStyle='rgba(255,220,180,.8)';cx.lineWidth=1.5;cx.beginPath();cx.arc(mouse.x,mouse.y,7,0,6.283);cx.stroke();line(cx,mouse.x-12,mouse.y,mouse.x-4,mouse.y);line(cx,mouse.x+4,mouse.y,mouse.x+12,mouse.y);line(cx,mouse.x,mouse.y-12,mouse.x,mouse.y-4);line(cx,mouse.x,mouse.y+4,mouse.x,mouse.y+12);}}

function drawCard(x,y,w,h,cd,face,sel){cx.save();cx.fillStyle='rgba(0,0,0,.4)';rr(cx,x+4,y+5,w,h,8);cx.fill();
 if(face){cx.fillStyle=sel?'#e8d8c8':'#f6f1e6';rr(cx,x,y,w,h,8);cx.fill();cx.strokeStyle=sel?'#c33':'#998';cx.lineWidth=sel?3:1;cx.stroke();const red=cd.s===1||cd.s===2;const col=red?'#b31b1b':'#111';const rs=RK[cd.r]||String(cd.r);
  txt(rs,x+10,y+16,18,col,'left','bold');txt(SU[cd.s],x+10,y+36,16,col,'left');txt(SU[cd.s],x+w/2,y+h/2+6,44,col,'center');txt(rs,x+w-10,y+h-16,18,col,'right','bold');if(sel){cx.fillStyle='rgba(180,20,20,.85)';cx.fillRect(x,y+h-26,w,20);txt('DISCARD',x+w/2,y+h-16,11,'#fff','center','bold');}}
 else{cx.fillStyle='#5a0d10';rr(cx,x,y,w,h,8);cx.fill();cx.strokeStyle='#c9a24a';cx.lineWidth=2;rr(cx,x+6,y+6,w-12,h-12,5);cx.stroke();txt('V',x+w/2,y+h/2,30,'#c9a24a','center','bold serif');}
 cx.restore();}

 txt('SAL "THE KNUCKLE" MARINO',480,84,14,'#e9b98a','center','bold');
 for(let i=0;i<5;i++){const r=cardRect(i,true);drawCard(r.x,r.y-10,r.w*.8,r.h*.8,PK.oh[i],PK.phase==='show',false);}

 txt('You  '+PK.wins+'  —  '+PK.losses+'  Sal',480,264,22,'#f3e6d6','center','bold serif');txt('Five-card draw · first to win 2 hands gets access · lose 2 and Sal shoots',480,290,12,'#bca','center');
 cx.font='15px Georgia,serif';const ml=wrap(cx,PK.msg,700);ml.forEach((l,i)=>txt(l,480,234-ml.length*9+i*18,15,'#ffe0b0','center','serif'));
 txt('Your hand: '+HN[evalHand(PK.ph)[0]],480,476,14,'#cfe','center','bold');
 if(PK.phase==='draw'){txt('Click cards to discard, then draw.',480,498,12,'#bbb','center');btn(380,506,200,28,PK.sel.some(v=>v)?'Draw '+PK.sel.filter(v=>v).length+' card(s)':'Stand pat',()=>pkDraw());}
 else{txt('Sal drew '+PK.oppDrew+' · Sal: '+PK.pb,480,498,12,'#fcb','center');btn(380,506,200,28,PK.wins>=2||PK.losses>=2?'Continue':'Next hand',()=>pkNext());}}

function retryMission(){const id=G.mis.id;if(G.snap)invLoad(G.snap);P.hp=P.maxHp;CHS[id]();}

/* =====================================================================
   MAIN LOOP
   ===================================================================== */
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;G.time+=dt;
 try{update(dt);render();}catch(e){console.error(e);}
 for(const k in kp)delete kp[k];mouse.click=mouse.rclick=false;mouse.wheel=0;requestAnimationFrame(frame);}
function update(dt){switch(G.mode){
 case'title':handleBtns();break;
 case'scene':updScene(dt);break;
 case'play':updPlay(dt);break;
 case'poker':updPoker(dt);break;
 case'menu':updMenu();break;
 case'shop':updShop();break;
 case'dead':G.deadT+=dt;if(G.deadReason==='revive'){if(G.deadT>1.4){G.deadReason='';playScene(SC.revive,()=>{const lost=Math.floor(P.money*.25);P.money-=lost;P.hp=P.maxHp;enterFree('forest');if(lost)toast('Lost $'+lost+'.');});}}else handleBtns();break;}}
function render(){BTN=[];switch(G.mode){
 case'title':renderTitle();break;
 case'scene':if(SCN)renderScene();break;
 case'play':renderWorld();break;
 case'poker':renderPoker();break;
 case'menu':if(G.menuFromPoker)renderPoker();else renderWorld();BTN=[];drawMenu();break;
 case'shop':renderWorld();BTN=[];drawShop();break;
 case'dead':renderDead();break;}}
requestAnimationFrame(frame);
</script>
